# Render Blueprint — deploys the whole PharmaTrack system (Flask UI + /api/v1
# + managed Postgres + APK download) to Render with `render blueprint launch`.
# Env vars marked "secrets" are generated once at first deploy; replace them
# in the Render dashboard afterwards.

databases:
  - name: pharmatrack-db
    plan: free
    databaseName: pharmatrack
    user: pharmatrack

services:
  - type: web
    name: pharmatrack
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmatrack-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false  # set a long random value in the dashboard / Secret Files
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PHARMATRACK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8