{% extends "base.html" %}
{% block title %}Edit {{ product.name }} - PharmaTrack{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto w-full">
    <div class="mb-8">
        <h2 class="font-headline-md text-display text-on-surface mb-2">Edit Product</h2>
        <p class="font-body-md text-on-surface-variant">Update this product's details. Stock levels are never edited
            directly — use Record Movement for that.</p>
    </div>

    <form method="POST" class="bg-surface-container-lowest border border-outline-variant p-6 rounded-lg space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
            <div class="space-y-2">
                <label class="block font-label-bold text-label-bold text-on-surface">Product Name *</label>
                <input
                    class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                    type="text" name="name" value="{{ product.name }}" required>
            </div>
            <div class="space-y-2">
                <label class="block font-label-bold text-label-bold text-on-surface">Category</label>
                <input
                    class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                    type="text" name="category" value="{{ product.category if product.category != '—' else '' }}">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
            <div class="space-y-2">
                <label class="block font-label-bold text-label-bold text-on-surface">Dosage Form</label>
                <select
                    class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                    name="dosage_form">
                    {% set forms = ['Tablet', 'Capsule', 'Syrup', 'Injection', 'Cream', 'Other'] %}
                    <option value="" {% if not product.dosage_form %}selected{% endif %}>Select...</option>
                    {% for f in forms %}
                    <option value="{{ f }}" {% if product.dosage_form==f %}selected{% endif %}>{{ f }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="space-y-2">
                <label class="block font-label-bold text-label-bold text-on-surface">Strength</label>
                <input
                    class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                    type="text" name="strength" value="{{ product.strength or '' }}">
            </div>
        </div>

        <div class="space-y-2">
            <label class="block font-label-bold text-label-bold text-on-surface">Barcode</label>
            <input
                class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                type="text" name="barcode" value="{{ product.barcode or '' }}">
        </div>

        <div class="flex gap-6">
            <label class="flex items-center gap-2">
                <input type="checkbox" name="requires_prescription"
                    class="rounded-sm border-outline-variant text-secondary focus:ring-secondary" {% if
                    product.requires_prescription %}checked{% endif %}>
                <span class="font-label-bold text-label-bold text-on-surface">Requires Prescription</span>
            </label>
            <label class="flex items-center gap-2">
                <input type="checkbox" name="is_controlled"
                    class="rounded-sm border-outline-variant text-secondary focus:ring-secondary" {% if
                    product.is_controlled %}checked{% endif %}>
                <span class="font-label-bold text-label-bold text-on-surface">Controlled Substance</span>
            </label>
        </div>

        <div class="pt-4 border-t border-outline-variant">
            <h3 class="font-headline-md text-headline-md text-on-surface mb-4">Pricing & Display</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
                <div class="space-y-2">
                    <label class="block font-label-bold text-label-bold text-on-surface">Price per Unit (FCFA)</label>
                    <input
                        class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                        type="number" name="price_per_unit" min="0" step="0.01" value="{{ product.price_per_unit or '' }}">
                </div>
                <div class="space-y-2">
                    <label class="block font-label-bold text-label-bold text-on-surface">Price per Packet (FCFA)</label>
                    <input
                        class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                        type="number" name="price_per_packet" min="0" step="0.01" value="{{ product.price_per_packet or '' }}">
                </div>
                <div class="space-y-2">
                    <label class="block font-label-bold text-label-bold text-on-surface">Packet Size</label>
                    <input
                        class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                        type="number" name="packet_size" min="1" value="{{ product.packet_size or '' }}">
                </div>
                <div class="space-y-2">
                    <label class="block font-label-bold text-label-bold text-on-surface">Unit Label</label>
                    <input
                        class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                        type="text" name="unit_label" value="{{ product.unit_label or '' }}" placeholder="e.g. tablet">
                </div>
                <div class="space-y-2 md:col-span-2">
                    <label class="block font-label-bold text-label-bold text-on-surface">Image URL</label>
                    <input
                        class="w-full bg-surface border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
                        type="url" name="image_url" value="{{ product.image_url or '' }}" placeholder="https://.../drug.jpg">
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-stack-gap pt-6 border-t border-outline-variant">
            <a href="{{ url_for('product_details', product_id=product.id) }}"
                class="px-6 py-2.5 rounded-lg border border-outline-variant bg-surface text-on-surface font-label-bold text-label-bold hover:bg-surface-container-high transition-colors">Cancel</a>
            <button
                class="px-8 py-2.5 rounded-lg bg-secondary text-on-secondary font-label-bold text-label-bold hover:opacity-90 transition-all shadow-lg shadow-secondary/20"
                type="submit">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
