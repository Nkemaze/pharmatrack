<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign in &middot; PharmaTrack</title>
    <script>
        (function () {
            if (localStorage.getItem('pharmatrack-theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config" src="{{ url_for('static', filename='tailwind-config.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="auth-shell">
        <span class="auth-blob auth-blob-1" aria-hidden="true"></span>
        <span class="auth-blob auth-blob-2" aria-hidden="true"></span>
        <span class="auth-blob auth-blob-3" aria-hidden="true"></span>

        <div class="auth-stage">

            <!-- Brand -->
            <div class="auth-brand-logo mb-1">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="PharmaTrack">
            </div>
            <p class="auth-tagline mb-8">Inventory Control &amp; Pharmaceutical Logistics</p>

            <!-- Card -->
            <div class="auth-card p-8 sm:p-10">

                {% if error %}
                <div
                    class="flex items-start gap-3 px-4 py-3 mb-6 bg-error-container border border-error/20 rounded-lg text-body-sm text-on-error-container">
                    <span class="material-symbols-outlined text-[18px] mt-[1px]">report</span>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <form method="POST" class="space-y-5" data-submit-spinner>
                    <input type="hidden" name="next" value="{{ next }}">

                    <div>
                        <label for="auth-name" class="auth-label">Name</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] pointer-events-none">person</span>
                            <input id="auth-name"
                                class="w-full pl-[44px] pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg text-body-md text-on-surface placeholder-on-surface-variant/60 focus:outline-none focus:border-secondary focus:ring-[3px] focus:ring-secondary/15 transition-all"
                                type="text" name="name" autocomplete="username" placeholder="pharmacist"
                                required autofocus>
                        </div>
                    </div>

                    <div>
                        <label for="auth-password" class="auth-label">Password</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] pointer-events-none">lock</span>
                            <input id="auth-password" data-pw-toggle
                                class="w-full pl-[44px] pr-[48px] py-3 bg-surface-container-low border border-outline-variant rounded-lg text-body-md text-on-surface focus:outline-none focus:border-secondary focus:ring-[3px] focus:ring-secondary/15 transition-all"
                                type="password" name="password" autocomplete="current-password"
                                placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
                            <button type="button" data-pw-btn aria-label="Show password"
                                class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 grid place-items-center rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-variant transition">
                                <span class="material-symbols-outlined text-[20px]">visibility</span>
                            </button>
                        </div>
                    </div>

                    <label class="auth-check">
                        <input type="checkbox" name="remember" value="on">
                        <span class="text-body-sm text-on-surface-variant">Remember this device</span>
                    </label>

                    <button type="submit" data-spinner
                        class="w-full h-12 bg-secondary text-on-secondary rounded-lg font-label-bold text-label-bold flex items-center justify-center gap-2 hover:opacity-90 active:scale-[.99] shadow-sm transition-all mt-2">
                        Sign In
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                    </button>
                </form>

                <!-- Card footer -->
                <div class="auth-foot">
                    <p class="auth-caption">Authorized Personnel Only</p>
                    <div class="auth-links">
                        <a href="#">Support</a>
                        <span class="auth-dot"></span>
                        <a href="#">Privacy</a>
                        <span class="auth-dot"></span>
                        <a href="#">Security</a>
                    </div>
                </div>
            </div>

            <p class="text-center text-body-sm text-on-surface-variant mt-6">
                New to PharmaTrack?
                <a href="{{ url_for('register') }}"
                    class="text-secondary font-label-bold hover:underline">Create an account</a>
            </p>
        </div>

        <div class="auth-status">
            <span class="dot"></span> Inventory sync active
        </div>
    </div>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>

</html>
